apiVersion: v1
kind: Secret
metadata:
  name: tmforum-openapi-secrets
  namespace: tmforum-openapi
type: Opaque
stringData:
  # JWT Secret (in production, use a secret manager)
  jwt.secret: "MyVerySecureSecretKeyForJWTThatMustBeVeryLongForHS512AtLeast256Bits"
  jwt.expiration: "3600"
  
  # MongoDB credentials (if authentication is required)
  # mongodb.username: "admin"
  # mongodb.password: "password"
  
  # Redis password (if required)
  # redis.password: ""

