apiVersion: v1
kind: ConfigMap
metadata:
  name: tmforum-openapi-config
  namespace: tmforum-openapi
data:
  # Server configuration
  server.port: "8080"
  server.servlet.context-path: "/api"
  
  # MongoDB configuration
  spring.data.mongodb.host: "mongodb-service"
  spring.data.mongodb.port: "27017"
  spring.data.mongodb.database: "openapidb"
  
  # Redis configuration
  # Temporarily disabled for serialization error debugging
  redis.enabled: "false"
  spring.data.redis.host: "redis-service"
  spring.data.redis.port: "6379"
  spring.data.redis.timeout: "2000ms"
  spring.cache.type: "none"
  spring.cache.redis.time-to-live: "600000"
  
  # Rate Limiting
  rate.limit.enabled: "false"
  rate.limit.requests-per-minute: "100"
  
  # Logging
  logging.level.com.tmforum.openapi: "INFO"
  logging.level.org.springframework.web: "INFO"
  logging.level.org.springframework.data.mongodb.core.MongoTemplate: "WARN"
  logging.level.org.springframework.security: "WARN"
  # Log path (use /tmp in Kubernetes to avoid permission issues)
  logging.file.path: "/tmp/logs"
  logging.file.name: "/tmp/logs/application.log"
  
  # Swagger/OpenAPI
  springdoc.api-docs.path: "/api-docs"
  springdoc.swagger-ui.path: "/swagger-ui.html"
  
  # Actuator
  management.endpoints.web.exposure.include: "health,info,metrics"
  management.endpoint.health.show-details: "when-authorized"
  management.health.mongo.enabled: "true"
  management.health.redis.enabled: "true"

