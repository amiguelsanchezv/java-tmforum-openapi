services:
  mongodb:
    image: mongo:7.0
    container_name: tmforum-openapi-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: openapidb
      # Optional: Authentication (uncomment if required)
      # MONGO_INITDB_ROOT_USERNAME: admin
      # MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      # Persistence: MongoDB data in ./data/mongodb
      - ./data/mongodb:/data/db
      # MongoDB logs
      - ./data/mongodb/logs:/var/log/mongodb
      # Custom configuration (optional)
      # - ./config/mongod.conf:/etc/mongod.conf:ro
    networks:
      - api-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: tmforum-openapi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      # Persistence: Redis data in ./data/redis
      - ./data/redis:/data
      # Custom configuration (optional)
      # - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - api-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tmforum-openapi
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATA_MONGODB_HOST=mongodb
      - SPRING_DATA_MONGODB_PORT=27017
      - SPRING_DATA_MONGODB_DATABASE=openapidb
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - REDIS_ENABLED=true
      - RATE_LIMIT_ENABLED=true
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - api-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Nota: The volumes now use bind mounts (host file paths)
# This allows direct access to data from the filesystem
# The data persists in ./data/mongodb and ./data/redis

networks:
  api-network:
    driver: bridge
    name: tmforum-openapi-network

