# Server configuration
server.port=8080
server.servlet.context-path=/api

# MongoDB Configuration (Local without authentication)
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=openapidb

# If you use MongoDB Atlas (cloud), uncomment and configure the complete URI:
# spring.data.mongodb.uri=mongodb+srv://user:password@cluster.mongodb.net/openapidb?retryWrites=true&w=majority

# If your local MongoDB requires authentication, use the complete URI:
# spring.data.mongodb.uri=mongodb://user:password@localhost:27017/openapidb

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# JWT Configuration
# JWT secret key to sign the tokens (must be at least 256 bits for HS512)
# In production, use a secure key and store it securely (environment variables, secrets manager, etc.)
jwt.secret=MyVerySecureSecretKeyForJWTThatMustBeVeryLongForHS512AtLeast256Bits
# Token expiration time in seconds (3600 = 1 hour)
jwt.expiration=3600

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.tmforum.openapi=DEBUG
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.cors=DEBUG

# Logging file configuration
logging.file.path=logs
logging.file.name=logs/application.log

# CORS Configuration (optional, can be configured from SecurityConfig)
# cors.allowed-origins=http://localhost:3000,http://localhost:4200

# Redis Configuration (optional)
# To enable Redis, set redis.enabled=true
redis.enabled=true
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=2000ms
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# Rate Limiting Configuration
rate.limit.enabled=true
rate.limit.requests-per-minute=100

