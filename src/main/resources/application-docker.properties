# Profile for Docker (docker-compose)
# This profile is activated when running with docker-compose

# Actuator - Health checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.mongo.enabled=true
management.health.redis.enabled=true

# MongoDB - Configured from docker-compose
# spring.data.mongodb.host=mongodb (service name)
# spring.data.mongodb.port=27017

# Redis - Configured from docker-compose
# spring.data.redis.host=redis (service name)
# spring.data.redis.port=6379

