# Configuration for Kubernetes profile
# This profile is activated automatically when running in Kubernetes

# Actuator - Health checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.mongo.enabled=true
management.health.redis.enabled=true

# Logging for Kubernetes (JSON format recommended)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.level.root=INFO
logging.level.com.tmforum.openapi=INFO

# MongoDB - Configured from ConfigMap
# spring.data.mongodb.host and port come from the ConfigMap

# Redis - Configured from ConfigMap
# spring.data.redis.host and port come from the ConfigMap

# JWT - Configured from Secret
# jwt.secret and jwt.expiration come from the Secret

# Rate Limiting - Configured from ConfigMap
# rate.limit.* come from the ConfigMap

