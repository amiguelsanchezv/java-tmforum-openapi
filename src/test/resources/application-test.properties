# Configuration for tests
# This profile configures a test environment without requiring a real MongoDB
# Tests that need MongoDB will use Testcontainers

# Disable DataInitializer in tests
data.initializer.enabled=false

# MongoDB - will be configured dynamically with Testcontainers when needed
# If Testcontainers is not used, these values will not be used
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=openapidb_test

# Disable Redis by default in tests
redis.enabled=false
spring.cache.type=none

# Disable Rate Limiting by default in tests
rate.limit.enabled=false

# Server configuration for tests
server.port=0
server.servlet.context-path=/api

# Logging for tests
logging.level.root=WARN
logging.level.com.tmforum.openapi=DEBUG
logging.level.org.springframework=WARN
logging.level.org.springframework.data.mongodb=WARN

